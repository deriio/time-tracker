<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Учёт Времени v2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="theme.css?v=2.0">
</head>

<body>
    <div id="app">
        <!-- Loader: Premium Style -->
        <div id="loading"
            style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;color:var(--text-dim);">
            <div class="spinner"></div>
            <p style="margin-top:20px;letter-spacing:1px;font-weight:600;text-transform:uppercase;font-size:12px;">
                Загрузка системы...</p>
        </div>
    </div>

    <!-- Screen Templates -->

    <!-- ORPHAN / CLAIM FLOW -->
    <template id="template-orphan">
        <div class="screen orphan-screen">
            <h2>🔎 Идентификация</h2>
            <p class="subtitle">Ваш аккаунт не привязан. Выберите ваше имя из списка ниже:</p>
            <div class="form-group">
                <label>Сотрудник:</label>
                <select id="orphan-select">
                    <option value="">-- Выберите из списка --</option>
                </select>
            </div>
            <p class="warning-text">⚠️ Внимание! Это действие будет опубликовано в общей группе для подтверждения вашей
                личности.</p>
            <button id="btn-claim" class="btn primary" disabled>✅ Это я, привязать аккаунт</button>
        </div>
    </template>

    <!-- EMPLOYEE FLOW -->
    <template id="template-employee">
        <div class="screen employee-screen">
            <h2 id="greeting">Здравствуйте!</h2>
            <div class="camera-section">
                <div class="preview-box">
                    <img id="photo-preview" alt="Превью">
                    <div id="camera-placeholder" class="camera-placeholder">
                        <span class="placeholder-icon">📸</span>
                        <p>Нажмите кнопку ниже,<br>чтобы сделать фото</p>
                    </div>
                </div>
                <input type="file" id="camera-input" accept="image/*" capture
                    style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
                <button id="btn-snap" class="btn secondary">📸 Сделать фото (Камера)</button>
                <button id="btn-retake" class="btn link" style="display:none">Переснять</button>
            </div>

            <div class="action-grid">
                <button id="btn-check-in" class="btn success" disabled>🟢 НАЧАЛ РАБОТУ</button>
                <button id="btn-check-out" class="btn danger" disabled>🔴 ЗАКОНЧИЛ РАБОТУ</button>
            </div>
        </div>
    </template>

    <!-- SUPERVISOR FLOW -->
    <template id="template-supervisor">
        <div class="screen supervisor-screen">
            <h2>👷 Режим Бригадира</h2>
            <div class="form-group">
                <label>Выбор сотрудника:</label>
                <select id="target-select">
                    <option value="">-- Выберите сотрудника --</option>
                </select>
            </div>

            <div class="camera-section">
                <div class="preview-box">
                    <img id="photo-preview-super" alt="Превью">
                    <div id="camera-placeholder-super" class="camera-placeholder">
                        <span class="placeholder-icon">👥</span>
                        <p>Сделайте фото сотрудника</p>
                    </div>
                </div>
                <input type="file" id="camera-input-super" accept="image/*" capture
                    style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
                <button id="btn-snap-super" class="btn secondary">📸 Сделать фото</button>
            </div>

            <div class="action-grid">
                <button id="btn-super-in" class="btn success" disabled>🟢 Приход</button>
                <button id="btn-super-out" class="btn danger" disabled>🔴 Уход</button>
            </div>
        </div>
    </template>

    <!-- Dynamic Script Loading -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ver = urlParams.get('v') || '1.0';
        console.log("Loading app.js version:", ver);

        const script = document.createElement('script');
        script.src = `app.js?v=${ver}`;
        script.onerror = () => {
            document.getElementById('app').innerHTML = '<div class="screen"><h2>❌</h2><p>Ошибка загрузки логики. Проверьте интернет.</p></div>';
        };
        document.body.appendChild(script);
    </script>
</body>

</html>
